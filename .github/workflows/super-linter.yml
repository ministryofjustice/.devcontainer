---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@09922509de2c0169438d37592e837bce9c027bef # v4.3.0
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
