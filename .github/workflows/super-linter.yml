---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@4d6e492755f0025455f2dadf558a4f942bde560a # v4.3.1
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
