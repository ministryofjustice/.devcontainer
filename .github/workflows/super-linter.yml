---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@5d8d0f00346daa26a7dd1283ecd098bbcd2b5396 # v4.1.1
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
