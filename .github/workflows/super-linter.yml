---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@feb7a2d3220db8dcd1b541e43fa5596af398c491 # v4.1.3
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
