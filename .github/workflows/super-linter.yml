---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@f48cf9157c3eae2dcecf5173a474577aabcd37a5 # v4.1.2
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
