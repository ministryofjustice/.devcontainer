---
name: Super Linter

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@634721c67e9e1e3502c9a737fc102093ac0cf482 # v4.2.0
    with:
      super-linter-variables: |
        {
          "VALIDATE_JSCPD": false
        }
